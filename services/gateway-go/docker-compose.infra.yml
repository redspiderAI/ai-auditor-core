version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ai-auditor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-auditor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana-enterprise
    container_name: ai-auditor-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-auditor-gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_STREAM=audit_tasks
      - REDIS_GROUP=gateway_group
      - REDIS_CONSUMER=gateway_consumer
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - gateway_temp_docs:/app/temp_docs

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  gateway_temp_docs: