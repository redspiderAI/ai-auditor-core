# k8s-deployment.yaml - Kubernetes部署配置

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-go
  labels:
    app: gateway-go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-go
  template:
    metadata:
      labels:
        app: gateway-go
    spec:
      containers:
      - name: gateway-go
        image: gateway-go:latest
        ports:
        - containerPort: 8080
        env:
        - name: GATEWAY_PORT
          value: "8080"
        - name: TEMP_DIR
          value: "/tmp/docs"
        - name: PY_INFERENCE_ADDR
          value: "inference-py:8123"
        - name: EMERGENCY_MODE
          value: "true"
        - name: QUICK_AUDIT_URL
          value: "http://inference-py:8123/v1/quick-audit"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-go-service
spec:
  selector:
    app: gateway-go
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer