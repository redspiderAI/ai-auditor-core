[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parser-py"
version = "0.1.0"
description = "高性能文档解析与坐标定位引擎"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "python-docx==0.8.11",
    "PyPDF2==3.0.1",
    "grpcio==1.60.0",
    "grpcio-tools==1.60.0",
    "lxml==4.9.3"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.7",
    "pytest>=8.1.1"
]

[project.scripts]
parser_py = "src.main:main"
