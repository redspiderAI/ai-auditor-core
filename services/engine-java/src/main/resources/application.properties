# ============================================================
# Spring Boot HTTP 端口
# ============================================================
server.port=8081

# ============================================================
# 数据库配置（本地开发使用 H2 内嵌数据库，无需安装 PostgreSQL）
# 上服务器时将下面 H2 配置替换为真实 PostgreSQL 连接
# ============================================================
spring.datasource.url=jdbc:h2:mem:auditor_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# H2 控制台（本地调试用，可在浏览器访问 http://localhost:8081/h2-console）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Redis 配置（本地开发暂时禁用 Redis 自动配置，避免连接失败）
# 上服务器时删除 exclude 这行，改为配置真实 Redis 地址：
#   spring.data.redis.host=your-redis-host
#   spring.data.redis.port=6379
# ============================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# ============================================================
# Spring Batch 配置（使用 H2 自动建表，本地无需额外配置）
# ============================================================
spring.batch.jdbc.initialize-schema=always

# ============================================================
# 日志级别配置
# ============================================================
logging.level.com.auditor.engine=INFO
logging.level.org.drools=WARN
logging.level.io.grpc=INFO

# ============================================================
# 控制台日志编码（解决 Windows PowerShell/CMD 中文乱码）
# ============================================================
logging.charset.console=UTF-8
logging.charset.file=UTF-8
