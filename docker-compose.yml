version: '3.8'

services:
  # 成员 D: Go 网关与任务调度 (中控)
  gateway-go:
    build: ./services/gateway-go
    container_name: audit-gateway
    ports:
      - "8080:8080"
    environment:
      - RUST_PARSER_ADDR=parser-rs:52051
      - JAVA_ENGINE_ADDR=engine-java:9191
      - PY_INFERENCE_ADDR=inference-py:8123
      - EMERGENCY_MODE=true  # 启用应急模式
      - QUICK_AUDIT_URL=http://inference-py:8123/v1/quick-audit
      - REDIS_ADDR=redis:6379
      - REDIS_STREAM=audit_tasks
      - REDIS_GROUP=gateway_group
      - REDIS_CONSUMER=gateway_consumer
    depends_on:
      redis:
        condition: service_started
      inference-py:
        condition: service_started
    networks:
      - audit-network

  # 任务队列：Redis Streams
  redis:
    image: redis:7.2-alpine
    container_name: audit-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - audit-network

  # 成员 A: Rust 高性能解析模块 (应急模式下可选)
  parser-rs:
    build: ./services/parser-rs
    container_name: audit-parser
    volumes:
      - ./temp_docs:/app/data  # 共享文档存储
    networks:
      - audit-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles: ["normal"]  # 只在正常模式下启动

  # 成员 B: Java 业务规则引擎 (应急模式下可选)
  engine-java:
    build: ./services/engine-java
    container_name: audit-engine
    environment:
      - JAVA_OPTS=-Xmx2g -Xms2g
    networks:
      - audit-network
    depends_on:
      - parser-rs
    profiles: ["normal"]  # 只在正常模式下启动

  # 成员 C: Python Qwen 模型推理中台
  inference-py:
    build: ./services/inference-py
    container_name: audit-inference
    command: ["uv", "run", "main.py", "--rest", "--rest-host", "0.0.0.0", "--rest-port", "8123"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - QWEN_API_KEY=${QWEN_API_KEY}
      - MODEL_PATH=/app/models/qwen2.5
      - REST_PORT=8123
      - REST_HOST=0.0.0.0
    networks:
      - audit-network
    volumes:
      - ./models:/app/models # 映射本地预下载的模型
    ports:
      - "8123:8123"

networks:
  audit-network:
    driver: bridge

volumes:
  temp_docs:
  models:
  redis-data: